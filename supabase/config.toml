# Local Supabase configuration. Production settings live in the Supabase
# dashboard and the platform secret store, never here.
project_id = "vibefycode"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Deliberately low. A pagination bug should not be able to stream a whole table.
max_rows = 200

[db]
port = 54322
shadow_port = 54320
major_version = 16

[studio]
enabled = true
port = 54323

# Local mail catcher, so no test email can ever reach a real inbox.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
# VibefyCode is a security product. A six-character password would be embarrassing.
[auth.email.template]

[analytics]
enabled = false
