name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Gates, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scanner reads the working tree; history is not needed,
          # but a shallow clone still lets `git ls-files` enumerate it.
          fetch-depth: 1

      # No `version:` here on purpose. `package.json` sets `packageManager`, and
      # this action refuses to run when it is told the version twice — which is
      # how every CI run since the first one failed inside eleven seconds,
      # before a single gate had a chance to say anything.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Postgres 16 client and server
        # The row-level-security suite runs against a real Postgres rather than a
        # mock: these policies are the difference between a product and a breach.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16

      - run: pnpm install --frozen-lockfile

      # The suite drives a real browser: the engine's exploration stages, and
      # the PDF the report is rendered to. Without this, those stages fail, the
      # narrative comes back empty and the cost records come back short — three
      # unrelated-looking assertions with one cause. The a11y job had this from
      # the start; this one never did, and nothing noticed because no run had
      # ever reached the tests.
      - run: pnpm exec playwright install --with-deps chromium

      # Ordered cheapest-and-most-important first, so a leaked credential or an
      # over-claiming string is the first thing in the log rather than the last.
      #
      # Every gate carries `if: ${{ !cancelled() }}`, and that is not decoration.
      # Without it a failure in one step skips every step after it, and the run's
      # single red mark says nothing about which gates passed. On 2026-10-07 the
      # ninety-nine most recent runs on `main` were ninety-three failures, six
      # cancelled and no successes, back to 2026-09-21 — because the brand step
      # failed eleventh and formatting, typecheck, tests, schema, the legal
      # register and the stub check were all skipped behind it. A typecheck error
      # sat in `main` for a day with nothing saying so. The job still fails; it
      # now says what for. Held by tests/the-gate-that-hid-the-others.test.ts.
      - name: Secret scan
        if: ${{ !cancelled() }}
        run: pnpm check:secrets

      - name: Copy lint — no over-claiming language
        if: ${{ !cancelled() }}
        run: pnpm check:copy

      - name: Colour contrast — WCAG 2.2 AA
        if: ${{ !cancelled() }}
        run: pnpm check:contrast

      - name: Brand assets are current
        if: ${{ !cancelled() }}
        # The full build, not `--svg-only`. The flag skipped the raster section,
        # which is what writes the badge artwork `.webp` files — and
        # `apps/web/public/brand` is gitignored, so a fresh checkout has none and
        # `check:brand` on the next line could never pass. It is the check that
        # proves the badge a customer embeds is the supplied artwork rather than
        # a drawing of it, so weakening it was never the answer. The flag saved
        # 3.8 seconds and cost every gate behind this one.
        run: |
          pnpm brand:build
          git diff --exit-code -- brand/svg || {
            echo "::error::brand/svg is out of date. Run 'pnpm brand:build' and commit the result."
            exit 1
          }
          pnpm check:brand

      - name: Formatting
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: Typecheck
        if: ${{ !cancelled() }}
        # `pnpm -r typecheck && tsc --noEmit`: every workspace project's own tsc
        # and then the root. The two disagree — `apps/web` resolves modules as a
        # bundler does and the root as node does — so the root alone is half the
        # gate, and the half that misses what a page actually compiles against.
        run: pnpm typecheck

      - name: Tests
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Schema file matches the migrations
        if: ${{ !cancelled() }}
        run: pnpm check:schema

      - name: Legal register is complete
        if: ${{ !cancelled() }}
        # Missing from CI entirely until 2026-08-25 — the one gate `pnpm verify`
        # ran that nothing on the server did. Nobody noticed, because no run had
        # ever got far enough to notice anything. The same sentence was true
        # again six weeks later, of six gates at once, which is why the `if:`
        # above every one of these is there now.
        run: pnpm legal:registry

      - name: Fail if any STUB_ is undocumented
        if: ${{ !cancelled() }}
        # Spelled as the script rather than as the command it happens to run, so
        # `pnpm verify` and this file cannot drift into meaning different things.
        run: pnpm check:stubs

  accessibility:
    name: WCAG 2.2 AA — our own pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its own job because it needs the app built and served, which is a
    # different order of setup from a unit test. We score other people on this
    # dimension; being unscanned ourselves was the sharpest credibility gap in
    # the repository.
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. `package.json` sets `packageManager`, and
      # this action refuses to run when it is told the version twice — which is
      # how every CI run since the first one failed inside eleven seconds,
      # before a single gate had a chance to say anything.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Postgres 16 client and server
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Start the local Postgres the public pages read
        run: bash scripts/test-db.sh reset

      - name: Scan
        run: pnpm check:a11y
