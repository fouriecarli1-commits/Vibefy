name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Gates, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scanner reads the working tree; history is not needed,
          # but a shallow clone still lets `git ls-files` enumerate it.
          fetch-depth: 1

      # No `version:` here on purpose. `package.json` sets `packageManager`, and
      # this action refuses to run when it is told the version twice — which is
      # how every CI run since the first one failed inside eleven seconds,
      # before a single gate had a chance to say anything.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Postgres 16 client and server
        # The row-level-security suite runs against a real Postgres rather than a
        # mock: these policies are the difference between a product and a breach.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16

      - run: pnpm install --frozen-lockfile

      # Ordered cheapest-and-most-important first, so a leaked credential or an
      # over-claiming string fails in seconds rather than after the test suite.
      - name: Secret scan
        run: pnpm check:secrets

      - name: Copy lint — no over-claiming language
        run: pnpm check:copy

      - name: Colour contrast — WCAG 2.2 AA
        run: pnpm check:contrast

      - name: Brand assets are current
        run: |
          pnpm brand:build --svg-only
          git diff --exit-code -- brand/svg || {
            echo "::error::brand/svg is out of date. Run 'pnpm brand:build' and commit the result."
            exit 1
          }
          pnpm check:brand

      - name: Formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Schema file matches the migrations
        run: pnpm check:schema

      - name: Legal register is complete
        # Missing from CI entirely until 2026-08-25 — the one gate `pnpm verify`
        # ran that nothing on the server did. Nobody noticed, because no run had
        # ever got far enough to notice anything.
        run: pnpm legal:registry

      - name: Fail if any STUB_ is undocumented
        # Spelled as the script rather than as the command it happens to run, so
        # `pnpm verify` and this file cannot drift into meaning different things.
        run: pnpm check:stubs

  accessibility:
    name: WCAG 2.2 AA — our own pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its own job because it needs the app built and served, which is a
    # different order of setup from a unit test. We score other people on this
    # dimension; being unscanned ourselves was the sharpest credibility gap in
    # the repository.
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. `package.json` sets `packageManager`, and
      # this action refuses to run when it is told the version twice — which is
      # how every CI run since the first one failed inside eleven seconds,
      # before a single gate had a chance to say anything.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Postgres 16 client and server
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Start the local Postgres the public pages read
        run: bash scripts/test-db.sh reset

      - name: Scan
        run: pnpm check:a11y
